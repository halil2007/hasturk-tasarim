name: Search Console raporu
# Google Search Console verisini servis hesabıyla (yalnız okuma) her gün çeker → veri/gsc/*.json ve panel özeti src/blog/gsc-ozet.json (scripts/gsc-rapor.mjs)
# Zamanlanmış çalışma kapalı (Actions kotası): rapor istenince elle çalıştırılır. Sayfa dizin denetimi yalnız "dizin" işaretlenince.
on:
  workflow_dispatch:
    inputs:
      dizin:
        description: 'Sayfa dizin denetimi de yapılsın (uzun sürer)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gsc-rapor.mjs
        env:
          GSC_ANAHTAR: ${{ secrets.GSC_ANAHTAR }}
          DIZIN: ${{ github.event.inputs.dizin == 'true' && '1' || '0' }}
      - name: Dala ekle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A veri/gsc src/blog/gsc-ozet.json
          git diff --cached --quiet && { echo "değişiklik yok"; exit 0; }
          git commit -m "Search Console raporu"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
