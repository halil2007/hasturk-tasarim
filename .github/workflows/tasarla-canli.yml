name: Kendi Seranı Tasarla canlı kontrol

# Canlı ürün sayfasında 3B aracın ve menü bağlantısının göründüğünü denetler. Mağazaya dokunmaz.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/tasarla-canli.mjs', '.github/workflows/tasarla-canli.yml']

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - run: node scripts/tasarla-canli.mjs
