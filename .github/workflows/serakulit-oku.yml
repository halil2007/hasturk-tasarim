name: Serakulit vermikülit oku

# serakulit.com vermikülit ürünlerini okur (scripts/serakulit-oku.mjs), sonucu serakulit-veri dalına yazar. Mağazaya dokunmaz.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/serakulit-oku.mjs', '.github/workflows/serakulit-oku.yml']

permissions:
  contents: write

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - run: node scripts/serakulit-oku.mjs
      - name: Sonucu serakulit-veri dalına yaz
        if: always()
        run: |
          cd cikti && git init -q && git checkout -q -b serakulit-veri
          git config user.name "serakulit-oku" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "Serakulit okuma" && \
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" serakulit-veri
