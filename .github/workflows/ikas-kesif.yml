name: ikas API keşfi

on:
  workflow_dispatch:   # Secrets eklendikten sonra Actions sekmesinden çalıştırılır

permissions:
  contents: write

concurrency: kesif-${{ github.ref }}

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: API'yi keşfet (salt okunur)
        run: node scripts/ikas-kesif.mjs
        env:
          IKAS_STORE: ${{ secrets.IKAS_STORE }}
          IKAS_CLIENT_ID: ${{ secrets.IKAS_CLIENT_ID }}
          IKAS_CLIENT_SECRET: ${{ secrets.IKAS_CLIENT_SECRET }}
      - name: Sonuçları kaydet
        run: |
          git config user.name "ikas-kesif"
          git config user.email "actions@users.noreply.github.com"
          git add tarama
          git diff --cached --quiet || (git commit -m "ikas API keşfi" && git pull --rebase -q && git push)
