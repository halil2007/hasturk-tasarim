name: Taslakları görüntüle

on:
  workflow_dispatch:
  push:
    paths: ['taslak/*.html', '.github/workflows/taslak.yml']

permissions:
  contents: write

concurrency: taslak-${{ github.ref }}

jobs:
  goruntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tarayıcıyı kur
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Taslakların ekran görüntülerini al
        run: |
          URLS=""
          for f in taslak/*.html; do URLS="$URLS file://$PWD/$f"; done
          OUT=taslak/goruntu node scripts/tara.mjs $URLS
          rm -f taslak/goruntu/*.html taslak/goruntu/*.json
      - name: Sonuçları kaydet
        run: |
          git config user.name "taslak-goruntu"
          git config user.email "actions@users.noreply.github.com"
          git add taslak/goruntu
          git diff --cached --quiet || (git commit -m "Taslak ekran görüntüleri" && git pull --rebase -q && git push)
