name: Kendin Tasarla seçenek tanısı

# Sipariş ürününün seçenek yapısını ve fiyatlarını okur (gerçek site, sipariş verilmez, mağazaya dokunmaz).
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/tasarla-veri.mjs', '.github/workflows/tasarla-veri.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: ham=1 node scripts/tasarla-veri.mjs && cat public/tasarla/secenek.json
      - name: TCMB dolar kuru (fiyat karşılaştırması için)
        continue-on-error: true
        run: curl -s https://www.tcmb.gov.tr/kurlar/today.xml | tr -d '\r' | grep -A8 'CurrencyCode="USD"' | grep -E 'Tarih|ForexSelling|ForexBuying' ; curl -s https://www.tcmb.gov.tr/kurlar/today.xml | head -c 300
