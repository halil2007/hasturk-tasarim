name: Bilgi kaynağı keşfi

# scripts/kaynak-siteler.txt'deki siteler için robots.txt izni, site haritası ve bakım / rehber sayfası sayısı.
# İçerik indirmez ve kaydetmez (geliştirme ortamı bu sitelere erişemiyor). Mağazaya dokunmaz.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/kaynak-siteler.txt', 'scripts/kaynak-kesif.mjs', '.github/workflows/kaynak-kesif.yml']

permissions:
  contents: read

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/kaynak-kesif.mjs
