name: Kendin Tasarla sepet tanısı

# Sipariş ürününü anonim sepete ekleme denemesi (gerçek site, sipariş verilmez, mağazaya dokunmaz).
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/tasarla-sepet-diag.mjs', '.github/workflows/tasarla-sepet-diag.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - run: node scripts/tasarla-sepet-diag.mjs
